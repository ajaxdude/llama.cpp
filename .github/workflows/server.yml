name: Server

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      sha:
        description: 'Commit SHA1 to build'
        required: false
        type: string
      slow_tests:
        description: 'Run slow tests'
        required: true
        type: boolean
  push:
    branches:
      - master
    paths: [
      '.github/workflows/server.yml',
      '**/CMakeLists.txt',
      '**/Makefile',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.swift',
      '**/*.m',
      'tools/server/**.*'
    ]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/server.yml',
      '**/CMakeLists.txt',
      '**/Makefile',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.swift',
      '**/*.m',
      'tools/server/**.*'
    ]

env:
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  LLAMA_ARG_LOG_VERBOSITY: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential \
            xxd \
            git \
            cmake \
            curl \
            wget \
            language-pack-en \
            libssl-dev

      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: server-ubuntu-24.04-arm
          save: false

      - name: ccache-buckets-restore
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
        with:
          key: server-ubuntu-24.04-arm
          folder: llama.cpp
          hf_bucket: ggml-org/cache

      - name: Build
        id: cmake_build
        run: |
          cmake -B build \
            -DGGML_SCHED_NO_REALLOC=ON \
            -DLLAMA_OPENSSL=OFF
          cmake --build build --config Release -j $(nproc) --target \
            llama-server \
            llama-deepseek-v41-trace \
            llama-deepseek-v41-containment-helper \
            test-deepseek41-trace-manifest \
            test-deepseek41-trace-injected

      - name: ccache-buckets-save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CACHE_OUTPUT }}
        with:
          key: server-ubuntu-24.04-arm
          folder: llama.cpp
          evict-old-files: 1d
          hf_bucket: ggml-org/cache
          save: true

      - name: Python setup
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          pip-install: -r tools/server/tests/requirements.txt

      - name: DeepSeek V4.1 trace CTest
        id: deepseek_v41_trace_ctest
        run: |
          set -o pipefail
          ctest --test-dir build --show-only=json-v1 -R '^test-deepseek41-trace$' > build/test-deepseek41-trace-ctest-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("build/test-deepseek41-trace-ctest-metadata.json").read_text())
          tests = metadata.get("tests", [])
          if len(tests) != 1 or tests[0].get("name") != "test-deepseek41-trace":
              raise SystemExit(f"expected exactly one test-deepseek41-trace selector match, got {len(tests)}")
          properties = {
              item["name"]: item["value"]
              for item in tests[0].get("properties", [])
          }
          environment = properties.get("ENVIRONMENT", [])
          if isinstance(environment, str):
              environment = environment.split(";")
          required = (
              "DSV41_NATIVE_TRACE_BINARY=",
              "DSV41_NATIVE_CONTAINMENT_HELPER=",
              "DSV41_NATIVE_MANIFEST_BINARY=",
              "DSV41_NATIVE_INJECT_LIBRARY=",
          )
          missing = [
              name
              for name in required
              if not any(value.startswith(name) for value in environment)
          ]
          if missing:
              raise SystemExit(f"test-deepseek41-trace environment is incomplete: {missing}")
          PY
          : > build/test-deepseek41-trace-ctest.log
          ctest --test-dir build \
            -R '^test-deepseek41-trace$' \
            --output-on-failure \
            --verbose \
            --no-tests=error \
            --output-junit test-deepseek41-trace-ctest.xml \
            2>&1 | tee build/test-deepseek41-trace-ctest.log
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = ElementTree.parse("build/test-deepseek41-trace-ctest.xml").getroot()
          expected = {
              "tests": 1,
              "failures": 0,
              "disabled": 0,
              "skipped": 0,
          }
          actual = {
              name: int(report.attrib.get(name, -1))
              for name in expected
          }
          if actual != expected:
              raise SystemExit(f"test-deepseek41-trace JUnit result is invalid: {actual}")
          log = Path("build/test-deepseek41-trace-ctest.log").read_text(errors="replace")
          if "***Skipped" in log or "***Not Run" in log or "OK (skipped=" in log:
              raise SystemExit("test-deepseek41-trace contained a skipped or not-run test")
          PY
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          metadata = json.loads(Path("build/test-deepseek41-trace-ctest-metadata.json").read_text())
          test = metadata["tests"][0]
          properties = {
              item["name"]: item["value"]
              for item in test.get("properties", [])
          }
          environment = properties["ENVIRONMENT"]
          if isinstance(environment, str):
              environment = environment.split(";")
          child_environment = dict(os.environ)
          for value in environment:
              name, setting = value.split("=", 1)
              child_environment[name] = setting
          test_name = "TraceFormatTests.test_native_watchdog_validation_crosses_private_pid_namespace"
          result = subprocess.run(
              [*test["command"], test_name, "--verbose"],
              cwd=properties["WORKING_DIRECTORY"],
              env=child_environment,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              check=False,
          )
          output = result.stdout
          Path("build/test-deepseek41-trace-linux-pidns.log").write_text(output, encoding="utf-8")
          print(output, end="")
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          if output.count("Ran 1 test") != 1 or test_name not in output:
              raise SystemExit("private PID namespace/pidfd test count is not exactly one")
          if "skipped" in output.lower() or not output.rstrip().endswith("OK"):
              raise SystemExit("private PID namespace/pidfd test was skipped or did not pass")
          PY

      - name: Upload DeepSeek V4.1 trace CTest evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-v41-trace-ctest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-deepseek41-trace-ctest-metadata.json
            build/test-deepseek41-trace-ctest.log
            build/test-deepseek41-trace-ctest.xml
            build/test-deepseek41-trace-linux-pidns.log
          if-no-files-found: error
          retention-days: 7

      - name: Tests
        id: server_integration_tests
        run: |
          cd tools/server/tests
          ./tests.sh

      - name: Slow tests
        id: server_integration_tests_slow
        if: ${{ github.event.schedule || github.event.inputs.slow_tests == 'true' }}
        run: |
          cd tools/server/tests
          SLOW_TESTS=1 ./tests.sh

      - name: Tests (Backend sampling)
        id: server_integration_tests_backend_sampling
        run: |
          cd tools/server/tests
          export LLAMA_ARG_BACKEND_SAMPLING=1
          ./tests.sh

      - name: Slow tests (Backend sampling)
        id: server_integration_tests_slow_backend_sampling
        if: ${{ github.event.schedule || github.event.inputs.slow_tests == 'true' }}
        run: |
          cd tools/server/tests
          export LLAMA_ARG_BACKEND_SAMPLING=1
          SLOW_TESTS=1 ./tests.sh

  windows:
    runs-on: windows-2025

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: server-windows-2025-x64
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Build
        id: cmake_build
        shell: cmd
        run: |
          cmake -B build -G "Ninja Multi-Config" ^
            -DCMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_SCHED_NO_REALLOC=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target llama-server

      - name: Python setup
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          pip-install: -r tools/server/tests/requirements.txt

      - name: Tests
        id: server_integration_tests
        shell: bash
        run: |
          cd tools/server/tests
          export PYTHONIOENCODING=":replace"
          ./tests.sh

      - name: Slow tests
        id: server_integration_tests_slow
        if: ${{ github.event.schedule || github.event.inputs.slow_tests == 'true' }}
        shell: bash
        run: |
          cd tools/server/tests
          export SLOW_TESTS="1"
          ./tests.sh

      - name: ccache-clear
        uses: ./.github/actions/ccache-clear
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          key: server-windows-2025-x64
          older: 5m
          min: 1
          dry-run: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
