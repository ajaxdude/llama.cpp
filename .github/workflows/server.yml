name: Server

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      sha:
        description: 'Commit SHA1 to build'
        required: false
        type: string
      slow_tests:
        description: 'Run slow tests'
        required: true
        type: boolean
  push:
    branches:
      - master
    paths: [
      '.github/workflows/server.yml',
      '**/CMakeLists.txt',
      '**/Makefile',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.swift',
      '**/*.m',
      'tools/server/**.*'
    ]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/server.yml',
      '**/CMakeLists.txt',
      '**/Makefile',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.swift',
      '**/*.m',
      'tools/server/**.*'
    ]

env:
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  LLAMA_ARG_LOG_VERBOSITY: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential \
            xxd \
            git \
            cmake \
            curl \
            wget \
            language-pack-en \
            libssl-dev

      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: server-ubuntu-24.04-arm
          save: false

      - name: ccache-buckets-restore
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
        with:
          key: server-ubuntu-24.04-arm
          folder: llama.cpp
          hf_bucket: ggml-org/cache

      - name: Build
        id: cmake_build
        run: |
          cmake -B build \
            -DGGML_SCHED_NO_REALLOC=ON \
            -DLLAMA_OPENSSL=OFF
          cmake --build build --config Release -j $(nproc) --target \
            llama-server \
            llama-deepseek-v41-trace \
            llama-deepseek-v41-containment-helper \
            test-deepseek41-trace-manifest \
            test-deepseek41-trace-injected

      - name: ccache-buckets-save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CACHE_OUTPUT }}
        with:
          key: server-ubuntu-24.04-arm
          folder: llama.cpp
          evict-old-files: 1d
          hf_bucket: ggml-org/cache
          save: true

      - name: Python setup
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          pip-install: -r tools/server/tests/requirements.txt

      - name: DeepSeek V4.1 trace CTest
        id: deepseek_v41_trace_ctest
        run: |
          set -o pipefail
          ctest --test-dir build --show-only=json-v1 -R '^test-deepseek41-trace$' > build/test-deepseek41-trace-ctest-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("build/test-deepseek41-trace-ctest-metadata.json").read_text())
          tests = metadata.get("tests", [])
          if len(tests) != 1 or tests[0].get("name") != "test-deepseek41-trace":
              raise SystemExit(f"expected exactly one test-deepseek41-trace selector match, got {len(tests)}")
          properties = {
              item["name"]: item["value"]
              for item in tests[0].get("properties", [])
          }
          environment = properties.get("ENVIRONMENT", [])
          if isinstance(environment, str):
              environment = environment.split(";")
          required = (
              "DSV41_NATIVE_TRACE_BINARY=",
              "DSV41_NATIVE_CONTAINMENT_HELPER=",
              "DSV41_NATIVE_MANIFEST_BINARY=",
              "DSV41_NATIVE_INJECT_LIBRARY=",
          )
          missing = [
              name
              for name in required
              if not any(value.startswith(name) for value in environment)
          ]
          if missing:
              raise SystemExit(f"test-deepseek41-trace environment is incomplete: {missing}")
          PY
          rm -rf build/deepseek-v41-trace-hook build/deepseek-v41-trace-marker
          install -d -m 0700 build/deepseek-v41-trace-hook build/deepseek-v41-trace-marker
          cat > build/deepseek-v41-trace-hook/sitecustomize.py <<'PY'
          import hashlib
          import json
          import os
          import time
          import unittest
          from pathlib import Path

          _TEST_CLASS = "TraceFormatTests"
          _TEST_METHOD = "test_native_watchdog_validation_crosses_private_pid_namespace"
          _TEST_ID = f"__main__.{_TEST_CLASS}.{_TEST_METHOD}"
          _SOURCE = Path(os.environ["DSV41_CI_TEST_SOURCE"]).resolve(strict=True)
          _MARKER_DIR = Path(os.environ["DSV41_CI_MARKER_DIR"]).resolve(strict=True)
          _BINDINGS = (
              "DSV41_NATIVE_TRACE_BINARY",
              "DSV41_NATIVE_CONTAINMENT_HELPER",
              "DSV41_NATIVE_MANIFEST_BINARY",
              "DSV41_NATIVE_INJECT_LIBRARY",
          )
          _ORIGINAL_CALL_TEST_METHOD = unittest.TestCase._callTestMethod

          def _write_marker(path, payload):
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              try:
                  os.write(descriptor, (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii"))
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)

          def _call_test_method(self, method):
              function = getattr(method, "__func__", method)
              code = getattr(function, "__code__", None)
              source = Path(code.co_filename).resolve(strict=True) if code is not None else None
              if self.__class__.__name__ == _TEST_CLASS and method.__name__ == _TEST_METHOD and source == _SOURCE:
                  bindings = {}
                  for name in _BINDINGS:
                      value = os.environ.get(name)
                      if not value:
                          raise RuntimeError(f"missing {name} binding")
                      bindings[name] = str(Path(value).resolve(strict=True))
                  payload = {
                      "bindings": bindings,
                      "event": "test_method_entry",
                      "first_line": code.co_firstlineno,
                      "function": _TEST_METHOD,
                      "pid": os.getpid(),
                      "ppid": os.getppid(),
                      "source": str(source),
                      "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                      "test_id": self.id(),
                      "timestamp_monotonic_ns": time.monotonic_ns(),
                  }
                  try:
                      _write_marker(_MARKER_DIR / "entry.json", payload)
                  except FileExistsError:
                      duplicate = _MARKER_DIR / f"duplicate-{os.getpid()}-{time.monotonic_ns()}.json"
                      _write_marker(duplicate, payload)
                      raise RuntimeError(f"{_TEST_ID} entered more than once")
              return _ORIGINAL_CALL_TEST_METHOD(self, method)

          unittest.TestCase._callTestMethod = _call_test_method
          PY
          chmod 0444 build/deepseek-v41-trace-hook/sitecustomize.py
          cmake -E sha256sum build/deepseek-v41-trace-hook/sitecustomize.py > build/deepseek-v41-trace-hook/sitecustomize.sha256
          : > build/test-deepseek41-trace-ctest.log
          PYTHONPATH="$PWD/build/deepseek-v41-trace-hook${PYTHONPATH:+:$PYTHONPATH}" \
            DSV41_CI_MARKER_DIR="$PWD/build/deepseek-v41-trace-marker" \
            DSV41_CI_TEST_SOURCE="$PWD/tests/test-deepseek41-trace.py" \
            ctest --test-dir build \
            -R '^test-deepseek41-trace$' \
            --output-on-failure \
            --verbose \
            --no-tests=error \
            --output-junit test-deepseek41-trace-ctest.xml \
            2>&1 | tee build/test-deepseek41-trace-ctest.log
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          report = ElementTree.parse("build/test-deepseek41-trace-ctest.xml").getroot()
          expected = {
              "tests": 1,
              "failures": 0,
              "disabled": 0,
              "skipped": 0,
          }
          actual = {
              name: int(report.attrib.get(name, -1))
              for name in expected
          }
          if actual != expected:
              raise SystemExit(f"test-deepseek41-trace JUnit result is invalid: {actual}")
          log = Path("build/test-deepseek41-trace-ctest.log").read_text(errors="replace")
          if "***Skipped" in log or "***Not Run" in log or "OK (skipped=" in log:
              raise SystemExit("test-deepseek41-trace contained a skipped or not-run test")

          metadata = json.loads(Path("build/test-deepseek41-trace-ctest-metadata.json").read_text())
          test = metadata["tests"][0]
          properties = {
              item["name"]: item["value"]
              for item in test.get("properties", [])
          }
          environment = properties["ENVIRONMENT"]
          if isinstance(environment, str):
              environment = environment.split(";")
          expected_bindings = {}
          for value in environment:
              name, setting = value.split("=", 1)
              if name.startswith("DSV41_NATIVE_"):
                  expected_bindings[name] = str(Path(setting).resolve(strict=True))
          if set(expected_bindings) != {
              "DSV41_NATIVE_TRACE_BINARY",
              "DSV41_NATIVE_CONTAINMENT_HELPER",
              "DSV41_NATIVE_MANIFEST_BINARY",
              "DSV41_NATIVE_INJECT_LIBRARY",
          }:
              raise SystemExit("test-deepseek41-trace native bindings are invalid")
          test_name = "TraceFormatTests.test_native_watchdog_validation_crosses_private_pid_namespace"
          marker_dir = Path("build/deepseek-v41-trace-marker")
          entries = list(marker_dir.glob("entry.json"))
          duplicates = list(marker_dir.glob("duplicate-*.json"))
          unexpected = [
              path
              for path in marker_dir.iterdir()
              if path not in entries and path not in duplicates
          ]
          if len(entries) != 1 or duplicates or unexpected:
              raise SystemExit(
                  f"private PID namespace/pidfd entry count is invalid: "
                  f"entries={len(entries)} duplicates={len(duplicates)} unexpected={len(unexpected)}")
          marker = json.loads(entries[0].read_text())
          expected_source = Path("tests/test-deepseek41-trace.py").resolve(strict=True)
          expected_marker = {
              "bindings": expected_bindings,
              "event": "test_method_entry",
              "function": test_name.split(".", 1)[1],
              "source": str(expected_source),
              "source_sha256": hashlib.sha256(expected_source.read_bytes()).hexdigest(),
              "test_id": f"__main__.{test_name}",
          }
          for name, value in expected_marker.items():
              if marker.get(name) != value:
                  raise SystemExit(f"private PID namespace/pidfd marker {name} is invalid")
          if not isinstance(marker.get("first_line"), int) or marker["first_line"] <= 0:
              raise SystemExit("private PID namespace/pidfd marker first_line is invalid")
          if not isinstance(marker.get("pid"), int) or marker["pid"] <= 1:
              raise SystemExit("private PID namespace/pidfd marker pid is invalid")
          if not isinstance(marker.get("ppid"), int) or marker["ppid"] <= 0:
              raise SystemExit("private PID namespace/pidfd marker ppid is invalid")
          if not isinstance(marker.get("timestamp_monotonic_ns"), int) or marker["timestamp_monotonic_ns"] <= 0:
              raise SystemExit("private PID namespace/pidfd marker timestamp is invalid")
          PY

      - name: Upload DeepSeek V4.1 trace CTest evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-v41-trace-ctest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-deepseek41-trace-ctest-metadata.json
            build/test-deepseek41-trace-ctest.log
            build/test-deepseek41-trace-ctest.xml
            build/deepseek-v41-trace-hook/sitecustomize.py
            build/deepseek-v41-trace-hook/sitecustomize.sha256
            build/deepseek-v41-trace-marker/
          if-no-files-found: error
          retention-days: 7

      - name: Tests
        id: server_integration_tests
        run: |
          cd tools/server/tests
          ./tests.sh

      - name: Slow tests
        id: server_integration_tests_slow
        if: ${{ github.event.schedule || github.event.inputs.slow_tests == 'true' }}
        run: |
          cd tools/server/tests
          SLOW_TESTS=1 ./tests.sh

      - name: Tests (Backend sampling)
        id: server_integration_tests_backend_sampling
        run: |
          cd tools/server/tests
          export LLAMA_ARG_BACKEND_SAMPLING=1
          ./tests.sh

      - name: Slow tests (Backend sampling)
        id: server_integration_tests_slow_backend_sampling
        if: ${{ github.event.schedule || github.event.inputs.slow_tests == 'true' }}
        run: |
          cd tools/server/tests
          export LLAMA_ARG_BACKEND_SAMPLING=1
          SLOW_TESTS=1 ./tests.sh

  windows:
    runs-on: windows-2025

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: server-windows-2025-x64
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Build
        id: cmake_build
        shell: cmd
        run: |
          cmake -B build -G "Ninja Multi-Config" ^
            -DCMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_SCHED_NO_REALLOC=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target llama-server

      - name: Python setup
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          pip-install: -r tools/server/tests/requirements.txt

      - name: Tests
        id: server_integration_tests
        shell: bash
        run: |
          cd tools/server/tests
          export PYTHONIOENCODING=":replace"
          ./tests.sh

      - name: Slow tests
        id: server_integration_tests_slow
        if: ${{ github.event.schedule || github.event.inputs.slow_tests == 'true' }}
        shell: bash
        run: |
          cd tools/server/tests
          export SLOW_TESTS="1"
          ./tests.sh

      - name: ccache-clear
        uses: ./.github/actions/ccache-clear
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          key: server-windows-2025-x64
          older: 5m
          min: 1
          dry-run: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
